<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Range Golf">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Range Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Brand: Range Golf, sibling of Range. Same goniometer mark with a ball on the arc, in fairway green; amber for "set up", slate blue for "fair".
   Layout: phone-width app shell. Four tabbed screens (Today, Plan, Library, Progress) over a fixed bottom tab bar; the skills test and the session player open full screen. */
:root{
  --bg:#EFF3EE; --card:#FBFCFA; --ink:#14201A; --muted:#55645B; --line:#D2DCD4; --far:#A7B4AB;
  --accent:#1D6B45; --accent-ink:#FFFFFF; --accent-soft:#DCEDE2;
  --brand:#0F3A28; --brand-ink:#FFFFFF; --brand-soft:#B9D9C5; --brand-arc:#7FCB98; --brand-far:#CFE8D8; --logo-arc:#1D6B45;
  --band:#A86C00; --band-soft:#F5E5C0; --mid:#2F5DB0; --done:#1D6B45; --done-soft:#DCEDE2; --warn:#B03A2E;
  --scrim:rgba(10,24,16,.5); --shadow:rgba(20,32,26,.12);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1410; --card:#131E18; --ink:#E3ECE6; --muted:#98A89E; --line:#26342C; --far:#4D5E54;
    --accent:#5CC48A; --accent-ink:#0C1410; --accent-soft:#16301F;
    --brand:#123F2B; --brand-ink:#FFFFFF; --brand-soft:#B9D9C5; --brand-arc:#7FCB98; --brand-far:#CFE8D8; --logo-arc:#5CC48A;
    --band:#F0B13A; --band-soft:#3A2C10; --mid:#86A8F0; --done:#5CC48A; --done-soft:#16301F; --warn:#F0806C;
    --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1410; --card:#131E18; --ink:#E3ECE6; --muted:#98A89E; --line:#26342C; --far:#4D5E54;
  --accent:#5CC48A; --accent-ink:#0C1410; --accent-soft:#16301F;
  --brand:#123F2B; --brand-ink:#FFFFFF; --brand-soft:#B9D9C5; --brand-arc:#7FCB98; --brand-far:#CFE8D8; --logo-arc:#5CC48A;
  --band:#F0B13A; --band-soft:#3A2C10; --mid:#86A8F0; --done:#5CC48A; --done-soft:#16301F; --warn:#F0806C;
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:12.5px}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.screen{display:flex;flex-direction:column;gap:22px}

/* Brand bar */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:-6px}
.lockup{display:flex;align-items:center;gap:10px;color:var(--ink)}
.lockup .mark{width:36px;height:36px;display:block;flex:none}
.lockup .wordmark{height:19px;width:auto;display:block}
.golf-tag{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--accent);padding:1px 7px;border:1.5px solid var(--accent);border-radius:6px;line-height:1.25}
.who{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.avatar{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;background:var(--line)}

/* Screen header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow,.kicker{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top h1{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:60px;line-height:.85;text-transform:uppercase;letter-spacing:.01em}
.stat{text-align:right;flex:none}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:.9;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.streak{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.streak svg{width:17px;height:17px}
.streak b{font-family:var(--f-display);font-size:20px;line-height:1}
.lede{margin:-8px 0 0;color:var(--muted);max-width:52ch}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
.h2{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:.95;text-transform:uppercase}
.h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.block{display:flex;flex-direction:column;gap:10px}
.sub2{margin:-4px 0 0;color:var(--muted);font-size:15px}
.fine{margin:0;font-size:13.5px;color:var(--muted)}
.note{margin:0;font-size:13.5px;color:var(--muted);max-width:60ch}
.warn-note{margin:0;padding:10px 12px;border-radius:12px;background:var(--band-soft);color:var(--ink);font-size:14.5px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.hero{background:var(--brand);color:var(--brand-ink);border-color:transparent;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center}
.hero p{margin:6px 0 0}
.hero .h2{font-size:34px}
.hero .cta{margin-top:14px;background:var(--brand-ink);color:var(--brand)}
.hero .kicker,.hero .fine{color:var(--brand-soft)}
.hero .fine{margin-top:8px}
.hero-fig{width:100%;height:auto;align-self:end}

.score-card{display:flex;align-items:center;gap:16px}
.ringbox{position:relative;flex:none;width:92px;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.ringbox svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.sr-bg{fill:none;stroke:var(--line);stroke-width:9}
.sr-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.sr-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sr-num b{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.85;font-variant-numeric:tabular-nums}
.sr-num small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.sc-txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.sc-txt p{margin:0}
.ringbox.lg{width:132px}
.ringbox.lg .sr-num b{font-size:56px}
.ringbox.xl{width:min(170px,48vw)}
.ringbox.xl .sr-num b{font-size:72px}

.sess-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--done-soft);color:var(--done)}
.focus{margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.focus b{color:var(--ink);background:var(--band-soft);padding:2px 9px;border-radius:99px;font-size:13.5px}
.focus b.other{background:var(--bg)}
.opt-group{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.len-l{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px;border-radius:12px;background:var(--bg)}
.seg.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.meta{margin:12px 0 0;color:var(--muted)}
.ex-list{list-style:none;margin:8px 0 16px;padding:0}
.ex-list.lib{margin:0}
.ex-row{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.ex-list.lib li:first-child .ex-row{border-top:0}
.ex-row .thumb{width:68px;height:44px;border-radius:8px;background:var(--bg);display:block;overflow:hidden}
.lib .ex-row .thumb{background:var(--card)}
.ex-row .thumb svg{width:100%;height:100%;display:block}
.ex-row .nm{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.ex-row .ds{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.ex-row .chev{color:var(--muted);width:18px;height:18px}
.cta{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:13px 16px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px}
.cta svg{width:20px;height:20px}
.link-btn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.under{display:flex;justify-content:center;margin-top:10px}
.done-note{margin:0;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--done-soft);color:var(--done);font-weight:700;font-size:14.5px}
.done-note svg{width:18px;height:18px;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.card .chip{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;min-width:0}
.tl-name{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;margin-top:2px}
.tl-meta{color:var(--muted)}
.tl-figs{display:flex;gap:4px;margin-top:8px;width:100%}
.tl-figs svg{flex:1;min-width:0;height:32px;background:var(--bg);border-radius:6px}
.area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.area-tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;min-width:0}
.at-name{font-weight:700;font-size:15.5px;line-height:1.2}
.at-meta{color:var(--muted)}

.track{position:relative;display:block;height:8px;border-radius:99px;background:var(--line)}
.fill{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent))}
.ghost{position:absolute;top:-4px;bottom:-4px;width:2.5px;border-radius:2px;background:var(--ink);opacity:.55}
.bars{display:flex;flex-direction:column;gap:12px}
.abar{display:grid;grid-template-columns:6.4em minmax(0,1fr) 5.6em;align-items:center;gap:10px}
.abar .an{font-weight:700;font-size:14.5px}
.abar .av{font-size:13px;font-weight:700;text-align:right;color:var(--c)}
.abar .av.none{color:var(--muted);font-weight:400}
.bars .track{height:10px}
.legend{margin:2px 0 0;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.legend i{width:2.5px;height:14px;border-radius:2px;background:var(--ink);opacity:.55}

.score-big{display:flex;align-items:center;gap:18px}
.delta{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--done)}
.delta.neg{color:var(--band)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:360px}
.cal-h{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;background:var(--line);color:var(--muted);max-width:100%}
.cal-d.on{background:var(--done);color:var(--card)}
.cal-d.fut{background:transparent;border:1.5px dashed var(--line);color:transparent}
.cal-d.today{box-shadow:0 0 0 2px var(--accent)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn svg{width:16px;height:16px;flex:none}
.vsum{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vsum p{margin:0}

/* Tutorial videos */
.yt-wrap{flex:none;position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-cap{margin:0;font-size:13px;color:var(--muted)}
.yt-cap a{font-weight:700}

/* Adaptation and coach */
.adapt{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.adapt li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.adapt li svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--accent)}
.checkin{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.checkin .ck-q{margin:6px 0 0;font-weight:700}
.checkin .chip{background:var(--bg)}
.checkin .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.checkin .seg{background:var(--bg)}
.checkin .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ck-note{margin:4px 0 0;font-size:14px;color:var(--muted)}
.coach{display:flex;flex-direction:column;gap:10px}
.coach .c-sum{margin:0;font-size:15.5px}
.coach ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.coach .c-applied{margin:0;font-size:13px;color:var(--muted)}
.coach .c-busy{margin:0;font-size:15px;color:var(--muted)}
.coach-badge{margin:0;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.coach-badge svg{width:16px;height:16px}

/* Plan grid */
.weeks{display:flex;flex-direction:column;gap:16px}
.week-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.week-head .wk{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase}
.week-head .wn{color:var(--muted);font-size:14.5px}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.day{appearance:none;position:relative;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;overflow:hidden}
.day .dn{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;font-variant-numeric:tabular-nums}
.day .dt{font-size:11.5px;line-height:1.1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day.done{background:var(--done-soft);border-color:transparent}
.day.done .dt{color:var(--done);font-weight:700}
.day.next:not(.sel)::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel .dn{color:var(--accent)}

/* Golfer figures */
.fig line,.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
.fig .near{stroke:var(--ink)}
.fig .hl.near{stroke:var(--accent)}
.fig .arm{stroke-width:4.2}
.fig .head{fill:var(--ink)}
.fig .head.hl{fill:var(--accent)}
.fig .gnd{stroke:var(--line);stroke-width:2.5}
.fig .shaft{stroke:var(--ink);stroke-width:2.4}
.fig .shaft.hl,.fig .chead.hl{stroke:var(--accent)}
.fig .chead{stroke:var(--ink);stroke-width:4.5}
.fig .chead.driver{stroke-width:7}
.fig .chead.putter{stroke-width:3.2}
.fig .ball{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.fig .tee{stroke:var(--muted);stroke-width:2}
.fig .holeC{fill:var(--ink)}
.fig .pole{stroke:var(--muted);stroke-width:2}
.fig .flagC{fill:var(--band)}
.fig .stick{stroke:var(--band);stroke-width:3}
.fig .towel{fill:var(--band-soft);stroke:var(--band);stroke-width:1.2}
.fig .sand{fill:var(--band-soft)}
.fig .mark{fill:var(--band)}
.fig.thumb line,.fig.thumb path{stroke-width:7}
.fig.thumb .arm{stroke-width:6}
.fig.thumb .shaft{stroke-width:3.4}
.fig.thumb .chead{stroke-width:6}
.fig.thumb .gnd{stroke-width:3}
.fig.thumb .tee,.fig.thumb .pole{stroke-width:3}
.hero .fig .near{stroke:var(--brand-ink)}
.hero .fig .hl.near,.hero .fig .shaft.hl,.hero .fig .chead.hl{stroke:var(--brand-arc)}
.hero .fig .head{fill:var(--brand-ink)}
.hero .fig .shaft,.hero .fig .chead{stroke:var(--brand-ink)}
.hero .fig .ball{fill:var(--brand-ink);stroke:none}

function poseAt(sw,u){

function gSolve(set,p){

function ballAt(dr,u,base){

  const q=(u-sw.imp)/(1-sw.imp),pr=a.props||[];

  if(sw.flight==="low")return {x:base[0]+q*260,y:base[1]-q*90+q*q*20,o:Math.max(0,1-q*2.6)};
  if(sw.flight==="pitch")return {x:base[0]+q*190,y:base[1]-Math.sin(Math.min(q*1.6,1)*Math.PI)*60,o:Math.max(0,1-Math.max(0,q-.45)*3)};

function normalize(o){

async function queueWrite(){
  if(ACC.writing){ACC.pending=true;return;}
  ACC.writing=true;
  try{
    do{
      ACC.pending=false;
      try{await ACC.ref.set(serial());}
      catch(e){
        if(e&&e.code==="unavailable"){await sleep(500+Math.random()*1000);try{await ACC.ref.set(serial());}catch(e2){onWriteFail(e2);}}

}

  ACC.mode="local";ACC.readOnly=c!=="quota_exceeded";ACC.full=c==="quota_exceeded";

}

function latest(area){for(let i=S.tests.length-1;i>=0;i--)if(S.tests[i].area===area)return S.tests[i];return null;}
const firstTest=area=>S.tests.find(t=>t.area===area)||null;

function firstScores(){const o={};AREAS.forEach(a=>{const t=firstTest(a.id);o[a.id]=t?t.score:null;});return o;}
const needOf=v=>110-(v==null?50:v);
function overallOf(s){const v=AREAS.map(a=>s[a.id]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;}
const testedCount=()=>AREAS.filter(a=>latest(a.id)).length;
function ranked(){const s=scores();return AREAS.map(a=>a.id).sort((x,y)=>(s[x]==null?50:s[x])-(s[y]==null?50:s[y])||AREA_IDX[x]-AREA_IDX[y]);}

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}

/* ---------- Adaptation ---------- */
const coachOn=()=>!!(S.coach&&S.coach.until>Date.now());
const shakyNow=()=>{const now=Date.now();return AREAS.map(a=>a.id).filter(a=>S.shaky[a]&&S.shaky[a]>now).sort((x,y)=>S.shaky[y]-S.shaky[x]);};
const listAreas=ids=>{const n=ids.map(a=>areaName(a).toLowerCase());return n.length>1?n.slice(0,-1).join(", ")+" and "+n[n.length-1]:(n[0]||"");};
/* Order used to pick each session's focus: weakest first, then areas flagged after recent sessions, then the coach's priorities on top. */
function planRank(){
  let rk=ranked();
  const sh=shakyNow();if(sh.length)rk=[...sh,...rk.filter(a=>!sh.includes(a))];
  if(coachOn()&&S.coach.focus.length)rk=[...S.coach.focus,...rk.filter(a=>!S.coach.focus.includes(a))];
  return rk;
}
function stageWeights(w){
  const b=STAGEW[w],l=S.load,c=coachOn()?S.coach.stage:null;
  const o={tech:b.tech-l*9,control:b.control+l*2,pressure:b.pressure+l*11};
  if(c&&o[c]!=null)o[c]+=20;
  return o;
}
function adaptNotes(){
  const n=[],sh=shakyNow();
  if(S.goals.length){
    n.push(`Working on ${listAreas(S.goals)}, as you chose.`);
    const has=LOCS[S.loc].has,miss=S.goals.filter(a=>!Object.values(DR).some(d=>d.area===a&&d.loc.some(l=>has.includes(l))));
    if(miss.length)n.push(`There are no ${listAreas(miss)} drills for "${LOCS[S.loc].name}", so this session covers what you can do there.`);
  }
  if(S.load>0)n.push(`Difficulty up ${S.load>1?"two steps":"a step"}: more pressure games and scoring challenges.`);
  if(S.load<0)n.push(`Difficulty down ${S.load<-1?"two steps":"a step"}: more technique drills and fewer games.`);
  if(sh.length)n.push(`A bit more ${listAreas(sh)} after you flagged it after a session.`);
  if(coachOn())n.push(`Your coach review from ${shortDate(S.coach.t)} is shaping this week.`);

}

/* ---------- Sessions ---------- */
const VENUE={range:0,short:1,green:2,home:3},STAGE_ORDER={tech:0,control:1,pressure:2};
const drSecs=(it,first)=>(first?PREP_FIRST:PREP)+it.dur*60;

const minsOf=items=>Math.max(1,Math.round(sessSecs(items)/60));
function venueOf(d,has){const v=d.loc.filter(l=>has.includes(l)).map(l=>VENUE[l]);return v.length?Math.min(...v):9;}

function focusOf(n){
  const pr=PLAN_PAIRS[(n-1)%SESSIONS],rk=planRank();
  /* Areas the person chose come first in every session. */
  const g=S.goals;
  if(g.length===2)return n%2?[g[1],g[0]]:[g[0],g[1]];
  if(g.length===1)return [g[0],((coachOn()&&S.coach.focus.find(a=>a!==g[0]))||[rk[pr[0]],rk[pr[1]],...rk].find(a=>a!==g[0]))];

  if(coachOn()&&S.coach.focus.length){const f=S.coach.focus;return [f[0],f[1]||rk.find(a=>a!==f[0])];}
  return [rk[pr[0]],rk[pr[1]]];
}
function practicePlan(n){

  const cand=Object.values(DR).filter(d=>d.loc.some(l=>has.includes(l))&&!(co&&co.avoid.includes(d.id))).map(d=>{
    let v=0;d.areas.forEach((a,i)=>{v+=needOf(s[a])*([1,.5,.3][i]||.3)*(a===f1?2.6:a===f2?2:.6);});
    v+=sw[d.stage]+hash(n+"|"+d.id+"|"+S.round)*30;
    if(co&&co.favour.includes(d.id))v+=45;

  }).sort((a,b)=>b.v-a.v);

  const target=S.len*60,items=[],cnt={},pool=cand.slice();let t=0;

    items.push(it);t+=secs;cnt[d.area]=(cnt[d.area]||0)+1;
    if(items.length>=2&&t>=target-90)break;
  }

  return {key:"plan:"+n,kind:"plan",n,w,f1,f2,loc:S.loc,items,notes:adaptNotes(),title:"Practice session",kicker:`Session ${n} of ${SESSIONS} · Week ${w+1}, ${WEEKS[w].name}`};
}

/* ---------- Speech and sound ---------- */
const canSpeak=("speechSynthesis" in window)&&typeof window.SpeechSynthesisUtterance!=="undefined";
let voice=null;
const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;
const ACCENTS={GB:"British",IE:"Irish",US:"American",AU:"Australian",NZ:"New Zealand",ZA:"South African",IN:"Indian",CA:"Canadian",SG:"Singaporean"};
function accentOf(lang){if(/gbsct|scot/i.test(lang||""))return "Scottish";const m=/^en[-_]([A-Za-z]{2})/.exec(lang||"");return (m&&ACCENTS[m[1].toUpperCase()])||"English";}
const accentRank=lang=>{const a=accentOf(lang);return a==="British"||a==="Irish"||a==="Scottish"?0:a==="American"?2:1;};
function englishVoices(){
  if(!canSpeak)return [];
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  const seen=new Set();
  return vs.filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)&&!seen.has(v.name)&&seen.add(v.name)).sort((a,b)=>accentRank(a.lang)-accentRank(b.lang)||a.name.localeCompare(b.name));
}
function pickVoice(){
  if(!canSpeak)return;
  const vs=englishVoices();
  voice=(S.vname&&vs.find(v=>v.name===S.vname))||vs.find(v=>/en[-_]GB/i.test(v.lang)&&/natural|enhanced|premium|neural/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs[0]||null;
}
if(canSpeak){const onVoices=()=>{pickVoice();const vs=document.getElementById("voiceSheet");if(vs&&!vs.hidden)renderVoiceSheet();};pickVoice();try{speechSynthesis.addEventListener("voiceschanged",onVoices);}catch(e){try{speechSynthesis.onvoiceschanged=onVoices;}catch(_){}}}
function say(text,interrupt,force){
  if(!canSpeak||(!S.voice&&!force)||!text)return;
  try{
    if(interrupt!==false)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang="en-GB";
    u.rate=S.rate||1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){if(canSpeak){try{speechSynthesis.cancel();}catch(e){}}}
let AC=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}}
function beep(freq,dur,vol,delay){
  if(!S.sound||!AC)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
let wake=null;
async function requestWake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){wake=null;}}
function releaseWake(){try{if(wake)wake.release();}catch(e){}wake=null;}

/* ---------- Animation ---------- */
const anims=new Set();
function uAt(a,t){const sw=SWINGS[a.ex.anim.s];if(REDUCED)return sw.still;return (Math.max(0,t-a.t0)%sw.per)/sw.per;}
function drawAnim(a,t){const u=uAt(a,t),key=a.ex.id+"|"+u.toFixed(3);if(key!==a.key){a.svg.innerHTML=golfMarkup(a.ex,u);a.key=key;}}
function frame(t){
  if(P.open)tickPlayer(t);
  anims.forEach(a=>{if(!a.paused&&a.svg&&a.svg.isConnected)drawAnim(a,t);});
  requestAnimationFrame(frame);
}

/* ---------- Shared markup ---------- */
function ringSVG(v){const r=40,c=2*Math.PI*r;return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="sr-bg" cx="50" cy="50" r="${r}"/><circle class="sr-fg" cx="50" cy="50" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-(v||0)/100)).toFixed(1)}"/></svg>`;}
function ringBox(v,cls,attrs){return `<${attrs?"button type=\"button\"":"div"} class="ringbox ${cls||""}" ${attrs||""}>${ringSVG(v)}<span class="sr-num"><b>${v==null?"–":v}</b><small>/ 100</small></span></${attrs?"button":"div"}>`;}
function exRow(it,label){
  const d=DR[it.id];
  return `<li><button type="button" class="ex-row" data-ex="${d.id}" aria-label="${esc(d.name)}: how to do it"><span class="thumb">${golfThumb(d)}</span><span><span class="nm">${esc(d.name)}</span><span class="ds">${esc(label!=null?label:doseText(d,it.dur))}</span></span>${ICON.chev}</button></li>`;
}
function areaBars(cur,ref){
  return `<div class="bars">${AREAS.map(a=>{
    const v=cur[a.id],r=ref?ref[a.id]:null;
    return `<div class="abar" style="--c:${lvColor(v)}"><span class="an">${a.name}</span><span class="track">${v!=null?`<span class="fill" style="width:${v}%"></span>`:""}${v!=null&&r!=null&&r!==v?`<span class="ghost" style="left:calc(${r}% - 1px)"></span>`:""}</span><span class="av${v==null?" none":""}">${v==null?"Not tested":v+" · "+lvName(v)}</span></div>`;
  }).join("")}</div>`;
}
function worksOn(sess){
  const seen=[];sess.items.forEach(it=>{const a=DR[it.id].area;if(!seen.includes(a))seen.push(a);});
  const order=[sess.f1,sess.f2].filter(Boolean);
  seen.sort((x,y)=>(order.indexOf(x)<0?9:order.indexOf(x))-(order.indexOf(y)<0?9:order.indexOf(y)));
  return seen;
}
function sessCard(sess,where){
  const done=sess.kind==="plan"&&isDone(sess.n),areas=worksOn(sess);
  let h=`<section class="card session"><div class="sess-top"><p class="kicker">${sess.kicker}</p>${done?'<span class="badge">Done</span>':""}</div><h2 class="h2">${sess.title}</h2>`;
  h+=`<p class="focus">Works on ${areas.map(a=>`<b class="${a===sess.f1||a===sess.f2?"":"other"}">${areaName(a)}</b>`).join("")}</p>`;
  if(sess.notes&&sess.notes.length)h+=`<ul class="adapt">${sess.notes.map(n=>`<li>${ICON.spark}<span>${n}</span></li>`).join("")}</ul>`;
  if(where==="today"||where==="plan"){
  h+=`<div class="opt-group"><span class="len-l" id="goalL-${where}">What do you want to work on?</span><div class="chips" role="group" aria-labelledby="goalL-${where}"><button type="button" class="chip" data-act="goal" data-goal="" aria-pressed="${!S.goals.length}">Follow my tests</button>${AREAS.map(a=>`<button type="button" class="chip" data-act="goal" data-goal="${a.id}" aria-pressed="${S.goals.includes(a.id)}">${a.name}</button>`).join("")}</div><span class="fine">Pick up to two. They come first in every session.</span></div>`;
    h+=`<div class="opt-group"><span class="len-l" id="locL-${where}">Where are you practising?</span><div class="chips" role="group" aria-labelledby="locL-${where}">${Object.entries(LOCS).map(([k,l])=>`<button type="button" class="chip" data-act="loc" data-loc="${k}" aria-pressed="${S.loc===k}">${l.name}</button>`).join("")}</div></div>`;
    h+=`<div class="opt-group"><span class="len-l" id="lenL-${where}">Session length</span><div class="seg" role="group" aria-labelledby="lenL-${where}">${LENS.map(m=>`<button type="button" data-act="len" data-len="${m}" aria-pressed="${S.len===m}">${m} min</button>`).join("")}</div></div>`;
  }
  h+=`<p class="meta mono">${sess.items.length} drills · about ${minsOf(sess.items)} min</p><ol class="ex-list">${sess.items.map(it=>exRow(it)).join("")}</ol>`;
  h+=`<button type="button" class="cta" data-act="start" data-sess="${sess.key}">${ICON.play}${done?"Do it again":"Start session"}</button>`;
  if(where==="plan")h+=`<div class="under"><button type="button" class="link-btn" data-act="toggle" data-day="${sess.n}">${done?"Untick this session":"Mark as done"}</button></div>`;
  return h+"</section>";
}

/* ---------- Screens ---------- */
let selDay=nextSession()||SESSIONS;
const heroDrill={id:"hero",anim:{s:"full",set:"driver",props:[],hl:["club"]}};

function renderToday(){
  const s=scores(),ov=overallOf(s),nd=nextSession(),wk=thisWeek(),tc=testedCount();
  const dateStr=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  let h=`<header class="top"><div><p class="eyebrow">${ACC.me&&ACC.me.name?"Hi "+esc(ACC.me.name.split(" ")[0])+" · ":""}${dateStr}</p><h1>Today</h1></div>${wk?`<span class="streak" title="Sessions this week">${ICON.flag}<b>${wk}</b>this week</span>`:""}</header>`;
  if(ACC.readOnly)h+=`<p class="warn-note">Your progress is only being saved on this device. To save it to your account, ask the person who shared Range Golf with you to give you edit access.</p>`;
  if(ACC.full)h+=`<p class="warn-note">Storage is full, so progress is only being saved on this device for now.</p>`;
  if(!tc){
    h+=`<section class="card hero"><div><p class="kicker">Skills test</p><h2 class="h2">Test your game</h2><p>Four short tests: putting, wedges, irons and driver. Do any of them on your next range visit. Each takes about 10 minutes.</p><button type="button" class="cta" data-act="test">Start a test</button><p class="fine">Until then you'll get a balanced plan.</p></div><svg class="fig hero-fig" id="heroFig" viewBox="56 18 150 152" aria-hidden="true"></svg></section>`;
  }else{
    const rk=ranked().filter(a=>s[a]!=null);
    h+=`<section class="card score-card">${ringBox(ov,"",`data-tab="progress" aria-label="Skill score ${ov} out of 100. Open progress."`)}<div class="sc-txt"><p class="kicker">Skill score</p><p>${rk.length>1&&s[rk[0]]===s[rk[1]]?`Weakest: <b>${areaName(rk[0])}</b> and <b>${areaName(rk[1])}</b>`:`Weakest: <b>${areaName(rk[0])}</b>`}${tc>1?` · Strongest: <b>${areaName(rk[rk.length-1])}</b>`:""}</p><p class="fine">${tc} of 4 areas tested · <button type="button" class="link-btn" data-act="test">${tc<4?"Test another":"Retest"}</button></p></div></section>`;
  }
  const last=S.log.filter(l=>l.kind==="plan").pop();
  if(last&&dayKey(last.t)===dayKey(Date.now())&&nd!==null)h+=`<p class="done-note">${ICON.check}Today's practice is done. The next session is ready whenever you are.</p>`;
  if(nd===null){
    h+=`<section class="card"><p class="kicker">Practice plan</p><h2 class="h2">All 12 sessions done</h2><p>Retest each area to see how your game has moved, then start another four weeks built from the new results.</p><div class="btn-row"><button type="button" class="btn primary" data-act="test">Retest my game</button><button type="button" class="btn" data-act="newround">Start another 4 weeks</button></div></section>`;
  }else h+=sessCard(practicePlan(nd),"today");
  if(coachOn()||(COACH.fn&&S.log.length>=2&&(!S.coach||Date.now()-S.coach.t>6*DAY_MS)))h+=coachCard();
  h+=`<section class="block"><h3 class="h3">Quick sessions</h3><div class="tiles">${Object.keys(QUICK).map(k=>{const ss=quickSession(k);return `<button type="button" class="tile" data-act="preview" data-sess="quick:${k}"><span class="kicker">${esc(ss.kicker)}</span><span class="tl-name">${ss.title}</span><span class="tl-meta mono">${minsOf(ss.items)} min · ${ss.items.length} drills</span><span class="tl-figs">${ss.items.slice(0,3).map(it=>golfThumb(DR[it.id])).join("")}</span></button>`;}).join("")}</div></section>`;
  h+=`<section class="block"><h3 class="h3">Target an area</h3><div class="area-grid">${AREAS.map(a=>{const ss=targetSession(a.id),v=s[a.id];return `<button type="button" class="area-tile" data-act="preview" data-sess="target:${a.id}" style="--c:${lvColor(v)}"><span class="at-name">${a.name}</span>${v!=null?`<span class="track"><span class="fill" style="width:${v}%"></span></span>`:""}<span class="at-meta mono">${v!=null?lvName(v)+" · ":""}${minsOf(ss.items)} min</span></button>`;}).join("")}</div></section>`;
  $("tab-today").innerHTML=h;
  const hf=$("heroFig");
  if(hf){heroAnim.svg=hf;heroAnim.t0=performance.now();heroAnim.key=null;anims.add(heroAnim);drawAnim(heroAnim,performance.now());}
  else anims.delete(heroAnim);
}

function renderPlan(){
  const nd=nextSession();
  let h=`<header class="top"><div><p class="eyebrow">4-week practice plan${S.round>1?` · round ${S.round}`:""}</p><h1>Plan</h1></div><div class="stat"><b>${doneCount()}/${SESSIONS}</b><span>sessions</span></div></header>`;
  h+=`<p class="lede">Three sessions a week. ${testedCount()?"Each one works on two areas picked from your tests, and your weakest area comes up most often.":"Each one works on two areas. Take a skills test and the plan shifts towards your weakest areas."} Drills move from technique to control to pressure games as the weeks go on.</p>`;
  h+=`<div class="weeks">`;
  WEEKS.forEach((w,wi)=>{
    h+=`<div class="week"><div class="week-head"><span class="wk">Week ${wi+1}</span><span class="wn">${w.name} · ${w.note}</span></div><div class="days">`;
    for(let n=wi*3+1;n<=wi*3+3;n++){
      const [f1,f2]=focusOf(n),cls=["day"];
      if(isDone(n))cls.push("done");if(n===nd)cls.push("next");if(n===selDay)cls.push("sel");
      h+=`<button type="button" class="${cls.join(" ")}" data-act="day" data-day="${n}" aria-pressed="${n===selDay}" aria-label="Session ${n}, ${areaName(f1)} and ${areaName(f2)}${isDone(n)?", done":""}${n===nd?", up next":""}"><span class="dn">${n}</span><span class="dt">${isDone(n)?"Done":areaShort(f1)+" + "+areaShort(f2)}</span></button>`;
    }
    h+="</div></div>";
  });
  h+="</div>"+sessCard(practicePlan(selDay),"plan");
  $("tab-plan").innerHTML=h;
}

  let h=`<header class="top"><div><p class="eyebrow">${Object.keys(DR).length} drills · tap for a demo</p><h1>Drills</h1></div></header>`;

  });

let resetAsk=false;
function voiceSummary(){
  if(!canSpeak)return "Voice coaching isn't available in this browser.";
  if(!S.voice)return "Off. Follow the cues on screen.";
  const r=(RATES.find(x=>x[0]===S.rate)||RATES[1])[1];
  return `${voice?esc(voice.name.replace(/\s*\(.*\)$/,""))+", "+accentOf(voice.lang)+" · ":""}${r} speed · ${S.detail==="short"?"Short cues":"Full instructions"}`;
}
function storageNote(){
  if(ACC.mode==="account")return "Saved to your Claude account, so it follows you to any device you sign in on. Only you can see your results.";
  if(ACC.readOnly)return "Saved on this device only, and only you can see it. Ask the person who shared Range Golf with you for edit access to save it to your account.";
  return "Saved on this device only. Nobody else can see your results.";
}
function renderProgress(){
  const s=scores(),ov=overallOf(s),f=firstScores(),tc=testedCount();
  const anyRetest=AREAS.some(a=>S.tests.filter(t=>t.area===a.id).length>1);

  if(!tc){
    h+=`<section class="card hero" style="grid-template-columns:1fr"><div><p class="kicker">No scores yet</p><h2 class="h2">Take a skills test</h2><p>Each test gives you a score for that part of your game. Retest after the four weeks to see what's changed.</p><button type="button" class="cta" data-act="test">Start a test</button></div></section>`;
  }else{
    const fo=overallOf(f),d=ov-fo;
    h+=`<section class="card block"><div class="score-big">${ringBox(ov,"lg")}<div class="sc-txt"><p class="kicker">Skill score</p>${anyRetest?`<p class="delta${d<0?" neg":""}">${d>=0?"+":""}${d}</p><p class="fine">since your first tests</p>`:`<p class="fine">Based on ${tc} of 4 areas. Retest after the four weeks to track your progress.</p>`}</div></div>
      ${areaBars(s,anyRetest?f:null)}${anyRetest?`<p class="legend"><i></i>Marker shows your first test</p>`:""}
      <button type="button" class="btn" data-act="test">${tc<4?"Test another area":"Retest an area"}</button></section>`;
  }

  const set=new Set(S.log.map(l=>dayKey(l.t))),now=new Date();now.setHours(0,0,0,0);
  const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7)-21);
  let active=0,cal="";
  for(let i=0;i<28;i++){const d=new Date(start);d.setDate(start.getDate()+i);const on=set.has(dayKey(d)),fut=d>now;if(on)active++;cal+=`<span class="cal-d${on?" on":""}${fut?" fut":""}${+d===+now?" today":""}">${d.getDate()}</span>`;}
  h+=`<section class="block"><h3 class="h3">Last 4 weeks</h3><div class="cal" role="img" aria-label="${active} practice days in the last four weeks">${"MTWTFSS".split("").map(c=>`<span class="cal-h" aria-hidden="true">${c}</span>`).join("")}${cal}</div></section>`;
  if(S.tests.length)h+=`<section class="block"><h3 class="h3">Tests</h3><ul class="hist card" style="padding-block:6px">${S.tests.slice().reverse().map(x=>`<li><span>${areaName(x.area)} · ${new Date(x.t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span><b>${x.score}</b></li>`).join("")}</ul></section>`;
  h+=coachCard();
  h+=`<section class="card vsum"><div><p class="kicker">Voice coach</p><p>${voiceSummary()}</p></div><button type="button" class="btn" data-act="voice">Change</button></section>`;
  h+=`<p class="note">${storageNote()}</p>`;
  h+=`<div class="confirm">${resetAsk?`<span>Clear your tests, sessions and plan progress?</span><button type="button" class="btn danger" data-act="resetyes">Clear everything</button><button type="button" class="btn" data-act="resetno">Cancel</button>`:`<button type="button" class="link-btn" data-act="reset">Reset all data</button>`}</div>`;
  $("tab-progress").innerHTML=h;
}
function renderAll(){renderToday();renderPlan();renderLibrary();renderProgress();}
let tab="today";
function go(name,keepScroll){
  tab=name;

  document.querySelectorAll(".tab").forEach(b=>{if(b.dataset.tab===name)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});

let sheetAnim=null,sheetFrom=null;
function openSheet(id,opts){
  const d=DR[id];

function tickPlayer(now){
  if(P.paused||P.done)return;
  const ph=P.phases[P.i],rem=ph.dur-(now-P.t0)/1000;
  if(rem<=0){advance(now);return;}

  const nd=nextSession();let next="";
  if(sess.kind==="plan"){
    if(nd){const [f1,f2]=focusOf(nd);next=`Next up: session ${nd}, working on ${areaName(f1).toLowerCase()} and ${areaName(f2).toLowerCase()}.`;}
    else next="That's all 12 sessions. Retest each area to see how your game has moved.";
  }else if(sess.kind==="quick"&&sess.q==="warm")next="You're warmed up. Have a good round.";
  else if(sess.kind==="quick")next="Putting tune-up done. Trust your stroke out there.";
  else next="Nice work. Your next practice session is waiting on the Today tab.";
  el.dnNext.textContent=next;
  el.dnRetest.hidden=!(sess.kind==="plan"&&!nd);
  beep(784,.16,.2,0);beep(988,.16,.2,.17);beep(1319,.34,.22,.34);
  say("Session done. Nice work.",true);
  el.dnBack.focus();
}
/* After-session check-in: shifts the mix of technique and pressure, and leans towards the area that felt shakiest. */
function applyCheck(){
  const c=P.ck;if(!c)return;
  let load=c.load0;if(c.feel==="easy")load++;if(c.feel==="hard")load--;
  S.load=Math.max(-2,Math.min(2,load));
  S.shaky=Object.assign({},c.shaky0);if(c.shaky)S.shaky[c.shaky]=Date.now()+7*DAY_MS;
  const i=S.log.findIndex(l=>l.t===c.t);
  if(i>=0)S.log[i]=Object.assign({},S.log[i],{feel:c.feel,shaky:c.shaky});
  save();
}
function renderCheck(){
  const c=P.ck;
  if(!c){el.dnCheck.hidden=true;el.dnCheck.innerHTML="";return;}
  let note="";
  if(c.feel==="easy")note=S.load>c.load0?"Next time: more pressure games and scoring challenges.":"You're already on the toughest setting. A retest will move things on.";
  else if(c.feel==="hard")note=S.load<c.load0?"Next time: more technique drills and fewer games.":"You're already on the gentlest setting. Try shorter sessions for a while.";
  else if(c.feel==="right")note="Good. The plan stays as it is.";
  if(c.shaky)note+=(note?" ":"")+`The next week leans a little more towards ${areaName(c.shaky).toLowerCase()}.`;
  el.dnCheck.innerHTML=`<p class="kicker">Quick check-in</p><p class="ck-q" id="ckFeelL">How did that feel?</p><div class="seg s3" role="group" aria-labelledby="ckFeelL">${[["easy","Too easy"],["right","About right"],["hard","Too hard"]].map(([k,n])=>`<button type="button" data-feel="${k}" aria-pressed="${c.feel===k}">${n}</button>`).join("")}</div><p class="ck-q" id="ckShL">What felt shakiest today?</p><div class="chips" role="group" aria-labelledby="ckShL">${AREAS.map(a=>`<button type="button" class="chip" data-shaky="${a.id}" aria-pressed="${c.shaky===a.id}">${a.name}</button>`).join("")}</div>${note?`<p class="ck-note">${note}</p>`:""}`;
  el.dnCheck.hidden=false;
}
el.dnCheck.addEventListener("click",e=>{
  const c=P.ck;if(!c)return;
  const f=e.target.closest("[data-feel]"),sh=e.target.closest("[data-shaky]");
  if(f)c.feel=c.feel===f.dataset.feel?null:f.dataset.feel;
  else if(sh)c.shaky=c.shaky===sh.dataset.shaky?null:sh.dataset.shaky;
  else return;
  applyCheck();renderCheck();
});

/* ---------- Claude coach (only where the page can reach Claude) ---------- */
const COACH={fn:null,busy:false,err:"",ctl:null};
const STAGES=["tech","control","pressure"];
function cleanCoach(o){
  const ids=new Set(Object.keys(DR)),areas=new Set(AREAS.map(a=>a.id));
  const arr=(x,ok,n)=>Array.isArray(x)?x.map(String).filter(ok).slice(0,n):[];
  const t=typeof o.t==="number"?o.t:Date.now();
  return {t,until:typeof o.until==="number"?o.until:t+7*DAY_MS,summary:String(o.summary||"").slice(0,700),focus:arr(o.focus,a=>areas.has(a),2),
    stage:STAGES.includes(o.stage)?o.stage:null,load:Math.max(-2,Math.min(2,Math.round(+o.load||0))),favour:arr(o.favour,i=>ids.has(i),4),avoid:arr(o.avoid,i=>ids.has(i),4),
    tips:arr(o.tips,x=>x.trim().length>0,3).map(x=>x.slice(0,160)),prevLoad:typeof o.prevLoad==="number"?o.prevLoad:0};
}
const iso=ts=>new Date(ts).toISOString().slice(0,10);
function coachPrompt(){
  const now=Date.now(),areas={};
  AREAS.forEach(a=>{const f=firstTest(a.id),l=latest(a.id);areas[a.id]={name:a.name,firstScore:f?f.score:null,latestScore:l?l.score:null,latestDate:l?iso(l.t):null,tests:S.tests.filter(t=>t.area===a.id).length};});
  const data={
    today:iso(now),
    plan:{nextSession:nextSession(),sessionsDone:doneCount(),of:SESSIONS,round:S.round},
    usuallyPractises:LOCS[S.loc].name,
    areas,
    sessionsLast7Days:S.log.filter(l=>l.t>now-7*DAY_MS).length,
    totalSessions:S.log.length,
    checkins:S.log.filter(l=>l.feel||l.shaky).slice(-12).map(l=>({date:iso(l.t),session:l.kind,feel:l.feel||null,shakiest:l.shaky||null})),
    currentDifficulty:S.load,
    goals:S.goals,
    drills:Object.values(DR).map(d=>({id:d.id,name:d.name,area:d.area,stage:d.stage,where:d.loc}))
  };
  return `You are the golf practice coach inside Range Golf. It builds practice sessions from four skills tests (putting, wedges, irons, driver; each scored out of 100, where 25 needs work and 100 is strong) and from check-ins after each session. Review this golfer's data and set adjustments for their next 7 days.

Rules:
- Base everything on the data below. Don't invent results or sessions. Untested areas have a null score.
- difficulty is an integer from -2 (more technique drills) to 2 (more pressure games and scoring). Move it by at most 1 from currentDifficulty, using the recent check-ins.
- stage: the kind of drill to lean on next week: "tech", "control" or "pressure".
- goals are areas the golfer chose to work on. Keep them in focus.
- focus: 1 or 2 area ids to prioritise (putt, wedge, iron, driver).
- favour and avoid: up to 4 drill ids each, only from the drills list, and only drills they can do where they usually practise.
- summary: 2 or 3 short sentences to the golfer, in UK English, warm and specific: what's going well and what next week works on. If an area is untested, suggest testing it.
- tips: up to 3 short practical tips, under 20 words each.

Reply with only JSON in exactly this shape:
{"summary":"...","focus":["putt"],"stage":"control","difficulty":0,"favour":["ladder"],"avoid":[],"tips":["..."]}

Data:
${JSON.stringify(data)}`;
}
async function runCoach(){
  if(!COACH.fn||COACH.busy)return;
  COACH.busy=true;COACH.err="";COACH.ctl=new AbortController();renderToday();renderProgress();
  try{
    const r=await COACH.fn.json(coachPrompt(),{signal:COACH.ctl.signal,cache:false});
    if(!r||typeof r!=="object"||Array.isArray(r))throw {code:"invalid_json"};
    const c=cleanCoach({t:Date.now(),summary:r.summary,focus:r.focus,stage:r.stage,load:r.difficulty,favour:r.favour,avoid:r.avoid,tips:r.tips,prevLoad:S.load});
    if(!c.summary)throw {code:"invalid_json"};
    S.coach=c;S.load=c.load;save();
  }catch(e){
    const code=e&&e.code;
    if(code==="cancelled"){}
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code))COACH.fn=null;
    else if(code==="rate_limited")COACH.err="Claude is busy or you've reached your usage limit. Try again later.";
    else if(code==="session_expired")COACH.err="Sign in to Claude again, then try the review.";
    else COACH.err="Couldn't get a review just now. Try again in a moment.";
  }finally{COACH.busy=false;COACH.ctl=null;renderAll();}
}
function coachCard(){
  const c=coachOn()?S.coach:null;
  if(!COACH.fn&&!c)return "";
  let h=`<section class="card coach"><p class="coach-badge">${ICON.coach}Coach review</p>`;
  if(COACH.busy)return h+`<p class="c-busy">Claude is looking at your scores and check-ins…</p><div class="btn-row"><button type="button" class="btn" data-act="coachstop">Stop</button></div></section>`;
  if(c){
    h+=`<p class="c-sum">${esc(c.summary)}</p>`;
    if(c.tips.length)h+=`<ul>${c.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    const bits=[];
    if(c.focus.length)bits.push("focus on "+listAreas(c.focus));
    if(c.stage)bits.push({tech:"more technique drills",control:"more distance-control drills",pressure:"more pressure games"}[c.stage]);
    if(c.favour.length)bits.push("more "+c.favour.map(i=>DR[i].name).join(", "));
    if(c.avoid.length)bits.push("a break from "+c.avoid.map(i=>DR[i].name).join(", "));
    h+=`<p class="c-applied">Applied until ${new Date(c.until).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}${bits.length?": "+esc(bits.join("; "))+".":"."}</p>`;
    h+=`<div class="btn-row">${COACH.fn?`<button type="button" class="btn" data-act="coach">Ask again</button>`:""}<button type="button" class="btn" data-act="coachundo">Undo changes</button></div>`;
  }else{
    h+=`<p class="c-sum">Let Claude look at your test scores and how your practice has gone, then adjust the next 7 days for you.</p>`;
    if(COACH.err)h+=`<p class="warn-note">${esc(COACH.err)}</p>`;
    h+=`<button type="button" class="btn primary" data-act="coach">Review my progress</button><p class="fine">Uses your own Claude account. Claude asks you to allow it the first time.</p>`;
  }
  return h+"</section>";
}
async function initCoach(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{COACH.fn=await window.claude.use("sample");}catch(e){COACH.fn=null;}
  if(COACH.fn){renderToday();renderProgress();}
}

function closePlayer(){
  P.open=false;anims.delete(plAnim);hush();releaseWake();
  el.player.hidden=true;document.body.style.overflow="";
  if(P.done&&P.sess.kind==="plan")selDay=nextSession()||P.sess.n;
  renderAll();
}
el.plPlay.addEventListener("click",togglePause);
el.plReady.addEventListener("click",()=>{if(P.phases[P.i].type==="prep")jump(P.i+1);});
el.plNext.addEventListener("click",()=>{const j=prepOf(P.phases[P.i].idx+1);if(j<0)finish();else jump(j);});
el.plPrev.addEventListener("click",()=>{
  const ph=P.phases[P.i],cur=prepOf(ph.idx),now=performance.now();
  if(P.i===cur&&now-P.t0<3000&&ph.idx>0)jump(prepOf(ph.idx-1));else jump(cur);
});
function howNow(){if(!P.paused)togglePause();openSheet(P.phases[P.i].d.id);}
el.plHow.addEventListener("click",howNow);
el.plName.addEventListener("click",howNow);
el.plClose.addEventListener("click",()=>{if(P.done){closePlayer();return;}el.endBar.hidden=false;if(!P.paused)togglePause();el.endNo.focus();});
el.endNo.addEventListener("click",()=>{el.endBar.hidden=true;if(P.paused)togglePause();});
el.endYes.addEventListener("click",closePlayer);
el.dnBack.addEventListener("click",closePlayer);
el.dnRetest.addEventListener("click",()=>{closePlayer();startTest();});
el.plYT.addEventListener("click",e=>{
  if(!P.paused&&!P.done)togglePause();
  const d=P.phases&&P.phases[P.i]&&P.phases[P.i].d;
  if(EMBED&&d&&d.vid){e.preventDefault();openSheet(d.id,{video:true});}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&P.open&&!P.done&&!P.paused)togglePause();});

/* ---------- Accounts ---------- */
function renderBrand(){
  const tag=$("brandTag"),me=ACC.me;
  if(!me||!me.id)return;
  tag.textContent="";tag.className="who";
  const img=document.createElement("img");img.className="avatar";img.alt="";img.src=me.avatarUrl;
  const sp=document.createElement("span");sp.textContent=me.name||"Signed in";
  tag.append(img,sp);
}
function applyRemote(data){
  if(ACC.writing||ACC.pending)return;
  const before=JSON.stringify(serial());
  S=normalize(data);
  if(JSON.stringify(serial())!==before){if(isDone(selDay)&&!P.open)selDay=nextSession()||selDay;renderAll();}
}
async function initAccount(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  let user=null,db=null;
  try{[user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);}catch(e){return;}
  if(!user)return;
  let me=null;try{me=await user.me();}catch(e){return;}
  ACC.user=user;ACC.me=me;ACC.owner=!!me.isOwner;
  renderBrand();
  if(!db||!me.id){renderAll();return;}
  ACC.uid=me.id;ACC.ref=db.doc("golfers/"+me.id);
  let snap=null;
  try{snap=await ACC.ref.get();}catch(e){renderAll();return;}
  ACC.mode="account";
  if(snap.exists)S=normalize(snap.data());
  else{
    let claimed=null;try{claimed=localStorage.getItem(KEY+"-account");}catch(e){}
    const hasLocal=S.tests.length||S.log.length||Object.keys(S.done).length;
    if(hasLocal&&(!claimed||claimed===me.id)){try{localStorage.setItem(KEY+"-account",me.id);}catch(e){}queueWrite();}
    else{const keep={voice:S.voice,sound:S.sound,vname:S.vname,rate:S.rate,detail:S.detail};S=Object.assign(normalize({}),keep);}
  }
  selDay=nextSession()||SESSIONS;
  ACC.ref.onSnapshot(s2=>{if(s2.exists&&!s2.metadata.hasPendingWrites&&!s2.metadata.fromCache)applyRemote(s2.data());},()=>{});
  renderAll();
}

/* ---------- Boot ---------- */
$("lockup").innerHTML=markSVG()+wordmarkSVG()+'<span class="golf-tag">GOLF</span>';
$("dnMark").innerHTML=markSVG();
renderAll();
const h0=(location.hash||"").slice(1);
go(["today","plan","library","progress"].includes(h0)?h0:"today",true);
requestAnimationFrame(frame);
initAccount();
initCoach();
})();
